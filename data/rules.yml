version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Always provide system info when the user need 
  steps:
  - intent: system_info
  - action: action_provide_system_info
  
